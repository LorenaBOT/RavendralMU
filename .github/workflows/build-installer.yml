name: Build MU Ravendral Installer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "installer/**"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        shell: pwsh
        run: git lfs pull

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\MU-Ravendral.iss"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MU-Ravendral-Season6E3-Setup
          path: installer/output/MU-Ravendral-Season6E3-Setup.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "season6e3-client-v1" "installer/output/MU-Ravendral-Season6E3-Setup.exe#MU Ravendral Season 6 Episode 3 Installer" --title "MU Ravendral Season 6 Episode 3" --notes "Instalador público de MU Ravendral Season 6 Episode 3." --target "${{ github.sha }}"
